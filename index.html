<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BeihaiTianming</title>
  <meta name="description" content="BeihaiTianming" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main class="sheet">
    <header class="rail">
      <a href="/">beihaitianming</a>
      <div class="rail-right">
        <time id="clock" aria-label="Local time">--:-- UTC+8</time>
        <button class="ink-dot" id="theme-toggle" type="button" title="切换明暗" aria-label="切换明暗"></button>
      </div>
    </header>

    <section class="intro">
      <h1>BeihaiTianming</h1>
      <p class="lead">写代码，做系统，偶尔记点东西。</p>
    </section>

    <nav class="index-list" aria-label="Index">
      <!-- 后续新增随笔可直接按同样结构添加一行 .row -->
      <a class="row" href="https://github.com/BeihaiTianming" target="_blank" rel="noopener">
        <span class="row-label">GitHub</span>
        <span class="row-line"></span>
        <span class="row-meta">@BeihaiTianming</span>
      </a>
    </nav>
  </main>

  <script>
    const root = document.documentElement;
    const saved = localStorage.getItem('theme');
    if (saved) root.setAttribute('data-theme', saved);

    document.getElementById('theme-toggle').addEventListener('click', () => {
      const dark =
        root.getAttribute('data-theme') === 'dark' ||
        (!root.getAttribute('data-theme') && matchMedia('(prefers-color-scheme: dark)').matches);
      const next = dark ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      localStorage.setItem('theme', next);
    });

    const clock = document.getElementById('clock');
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Shanghai',
      hour: '2-digit',
      minute: '2-digit',
      second: '2-digit',
      hour12: false
    });
    const tick = () => {
      clock.textContent = `${fmt.format(new Date())} UTC+8`;
    };
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
